<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle · expert mode</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #121213;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            margin: 0;
        }
        .game-container {
            max-width: 520px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        h1 {
            color: #e8e8e8;
            font-weight: 600;
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 2px solid #3a3a3c;
            padding-bottom: 8px;
            width: 100%;
            text-align: center;
        }
        .board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
        }
        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .tile {
            aspect-ratio: 1 / 1;
            background: #1e1e1f;
            border: 2px solid #3a3a3c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #e8e8e8;
            border-radius: 4px;
            transition: background 0.2s, border-color 0.2s, transform 0.1s;
            user-select: none;
        }
        .tile.filled {
            border-color: #6a6a6c;
        }
        .tile.correct {
            background: #538d4e;
            border-color: #538d4e;
            color: white;
        }
        .tile.present {
            background: #b59f3b;
            border-color: #b59f3b;
            color: white;
        }
        .tile.absent {
            background: #3a3a3c;
            border-color: #3a3a3c;
            color: #d7dadc;
        }
        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 500px;
            margin-top: 8px;
        }
        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: nowrap;
        }
        .key {
            background: #818384;
            border: none;
            border-radius: 4px;
            color: #f8f8f8;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            padding: 0 0.5rem;
            height: 56px;
            flex: 1;
            min-width: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.1s, transform 0.05s;
            box-shadow: 0 2px 0 #3a3a3c;
            font-family: inherit;
            user-select: none;
        }
        .key:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #3a3a3c;
        }
        .key.wide {
            flex: 1.5;
            font-size: 0.9rem;
            padding: 0 6px;
        }
        .key.correct {
            background: #538d4e;
            color: white;
        }
        .key.present {
            background: #b59f3b;
            color: white;
        }
        .key.absent {
            background: #3a3a3c;
            color: #a1a1a3;
        }
        .message {
            height: 24px;
            font-size: 1rem;
            font-weight: 600;
            color: #e8e8e8;
            text-align: center;
            letter-spacing: 1px;
            transition: opacity 0.2s;
            min-height: 1.5rem;
        }
        .message.error {
            color: #f5793b;
        }
        .message.success {
            color: #7bc47b;
        }
        .footer {
            color: #6a6a6c;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 8px;
            width: 100%;
            border-top: 1px solid #2a2a2c;
            padding-top: 12px;
        }
        .restart-btn {
            background: #2a2a2c;
            border: 1px solid #4a4a4c;
            color: #e8e8e8;
            padding: 8px 24px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
            margin-top: 4px;
        }
        .restart-btn:hover {
            background: #3a3a3c;
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>WORDLE</h1>
    <div class="message" id="message"></div>
    <div class="board" id="board"></div>
    <div class="keyboard" id="keyboard"></div>
    <button class="restart-btn" id="restart">New game</button>
    <div class="footer">expert mode · 6 tries</div>
</div>
<script>
    (function(){
        // ---------- CONFIG ----------
        const WORD_LENGTH = 5;
        const MAX_GUESSES = 6;
        const WORD_POOL = [
            // original 50 words
            "APPLE", "BRAVE", "CRANE", "DREAM", "EAGLE",
            "FLAME", "GRAPE", "HOUSE", "JELLY", "KNIFE",
            "LEMON", "MOUSE", "NIGHT", "OCEAN", "PIANO",
            "QUEEN", "RIVER", "SNAKE", "TIGER", "UNITY",
            "VOICE", "WATER", "XENON", "YOUTH", "ZEBRA",
            "ARISE", "BERRY", "CLOUD", "DANCE", "FLUTE",
            "GHOST", "HONEY", "IGLOO", "JOKER", "KARMA",
            "LIGHT", "MONEY", "NOBLE", "OPERA", "PEACE",
            "QUILT", "RADIO", "SMILE", "TRAIN", "ULTRA",
            "VIVID", "WHEAT", "YACHT", "ZESTY", "ACORN",
            // 100 additional words
            "ABIDE", "ABODE", "ACUTE", "ADOBE", "ADOPT",
            "ADULT", "AGENT", "AGREE", "AISLE", "ALARM",
            "ALBUM", "ALERT", "ALIEN", "ALIGN", "ALIKE",
            "ALIVE", "ALLEY", "ALLOW", "ALOFT", "ALONE",
            "ALONG", "ALTER", "AMBER", "AMBLE", "AMEND",
            "AMPLE", "ANGEL", "ANGER", "ANGLE", "ANKLE",
            "ANNOY", "APART", "APRON", "ARENA", "ARGUE",
            "ARMOR", "AROMA", "ARRAY", "ARROW", "ASIDE",
            "ASSET", "ATLAS", "ATTIC", "AUDIO", "AUDIT",
            "AVOID", "AWAIT", "AWAKE", "AWARD", "AWARE",
            "AWFUL", "BACON", "BADGE", "BADLY", "BAGEL",
            "BAKER", "BALMY", "BANAL", "BANJO", "BARGE",
            "BASIC", "BASIL", "BASIN", "BASIS", "BATCH",
            "BATHE", "BATON", "BEACH", "BEADY", "BEAST",
            "BEGAN", "BEGIN", "BEING", "BELOW", "BENCH",
            "BIRTH", "BISON", "BLACK", "BLADE", "BLAME",
            "BLAND", "BLANK", "BLAST", "BLAZE", "BLEAK",
            "BLEND", "BLESS", "BLIMP", "BLIND", "BLINK",
            "BLISS", "BLITZ", "BLOOD", "BLOOM", "BLOWN",
            "BLUES", "BLUNT", "BLURB", "BLUSH", "BOARD"
        ];

        // ---------- STATE ----------
        let secretWord = "";
        let currentRow = 0;
        let currentGuess = "";
        let gameOver = false;
        let guesses = [];           // store submitted guesses (strings)
        let letterStatus = {};      // key: letter -> 'correct' | 'present' | 'absent'

        // ---------- DOM REFS ----------
        const boardEl = document.getElementById('board');
        const keyboardEl = document.getElementById('keyboard');
        const messageEl = document.getElementById('message');
        const restartBtn = document.getElementById('restart');

        // ---------- INIT / RESET ----------
        function pickRandomWord() {
            return WORD_POOL[Math.floor(Math.random() * WORD_POOL.length)].toUpperCase();
        }

        function resetGame() {
            secretWord = pickRandomWord();
            currentRow = 0;
            currentGuess = "";
            gameOver = false;
            guesses = [];
            letterStatus = {};
            messageEl.textContent = "";
            messageEl.className = "message";

            // rebuild board and keyboard
            renderBoard();
            renderKeyboard();
            updateKeyboardStatuses();
        }

        // ---------- RENDER BOARD ----------
        function renderBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < MAX_GUESSES; r++) {
                const rowEl = document.createElement('div');
                rowEl.className = 'row';
                for (let c = 0; c < WORD_LENGTH; c++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.row = r;
                    tile.dataset.col = c;
                    rowEl.appendChild(tile);
                }
                boardEl.appendChild(rowEl);
            }
            // fill with any existing guesses (e.g., after restart? but we don't reuse, still safe)
            // we just clear and re-render, then if there are guesses (should be empty after reset)
            // but to be safe: if guesses array has content (not in reset) - we don't call with existing, but just in case
            if (guesses.length > 0) {
                // re-apply guesses to board (only for robustness)
                guesses.forEach((guess, idx) => {
                    if (idx >= MAX_GUESSES) return;
                    const rowTiles = getRowTiles(idx);
                    const statuses = evaluateGuess(guess, secretWord);
                    for (let i = 0; i < WORD_LENGTH; i++) {
                        const tile = rowTiles[i];
                        tile.textContent = guess[i];
                        tile.classList.add('filled', statuses[i]);
                    }
                });
            }
        }

        // helper: get tile elements for a specific row index
        function getRowTiles(rowIndex) {
            const rows = boardEl.querySelectorAll('.row');
            if (!rows[rowIndex]) return [];
            return Array.from(rows[rowIndex].querySelectorAll('.tile'));
        }

        // ---------- RENDER KEYBOARD ----------
        const KEYBOARD_ROWS = [
            ['Q','W','E','R','T','Y','U','I','O','P'],
            ['A','S','D','F','G','H','J','K','L'],
            ['ENTER','Z','X','C','V','B','N','M','⌫']
        ];

        function renderKeyboard() {
            keyboardEl.innerHTML = '';
            KEYBOARD_ROWS.forEach(row => {
                const rowEl = document.createElement('div');
                rowEl.className = 'keyboard-row';
                row.forEach(key => {
                    const keyEl = document.createElement('button');
                    keyEl.className = 'key';
                    if (key === 'ENTER' || key === '⌫') {
                        keyEl.classList.add('wide');
                    }
                    keyEl.textContent = key;
                    keyEl.dataset.key = key;
                    keyEl.addEventListener('click', () => handleKeyPress(key));
                    rowEl.appendChild(keyEl);
                });
                keyboardEl.appendChild(rowEl);
            });
        }

        // update all keyboard key colors based on letterStatus
        function updateKeyboardStatuses() {
            document.querySelectorAll('.key').forEach(keyEl => {
                const key = keyEl.dataset.key;
                // remove status classes
                keyEl.classList.remove('correct', 'present', 'absent');
                if (letterStatus[key]) {
                    keyEl.classList.add(letterStatus[key]);
                }
            });
        }

        // ---------- EVALUATE GUESS (Wordle algorithm) ----------
        function evaluateGuess(guess, secret) {
            const result = new Array(WORD_LENGTH).fill('absent');
            const secretChars = secret.split('');
            const guessChars = guess.split('');
            const secretCount = {};

            // first pass: correct positions
            for (let i = 0; i < WORD_LENGTH; i++) {
                if (guessChars[i] === secretChars[i]) {
                    result[i] = 'correct';
                } else {
                    // count remaining secret letters for second pass
                    secretCount[secretChars[i]] = (secretCount[secretChars[i]] || 0) + 1;
                }
            }

            // second pass: present letters
            for (let i = 0; i < WORD_LENGTH; i++) {
                if (result[i] === 'correct') continue;
                const ch = guessChars[i];
                if (secretCount[ch] > 0) {
                    result[i] = 'present';
                    secretCount[ch] -= 1;
                }
            }
            return result;
        }

        // ---------- UPDATE GAME STATE AFTER SUBMIT ----------
        function submitGuess() {
            // validation
            if (currentGuess.length !== WORD_LENGTH) {
                showMessage(`Need ${WORD_LENGTH} letters`, true);
                return;
            }
            if (!/^[A-Z]+$/.test(currentGuess)) {
                showMessage('Only letters A-Z', true);
                return;
            }
            // (optional) check against word pool if we want to restrict, but expert mode usually accepts any valid word.
            // We'll allow any 5-letter combo for flexibility. If we wanted strict: check WORD_POOL includes currentGuess.
            // But for expert mode, we keep it open.
            
            // evaluate against secret
            const statuses = evaluateGuess(currentGuess, secretWord);
            const rowTiles = getRowTiles(currentRow);

            // update board tiles
            for (let i = 0; i < WORD_LENGTH; i++) {
                const tile = rowTiles[i];
                tile.textContent = currentGuess[i];
                tile.classList.add('filled', statuses[i]);
            }

            // update global letter status (only upgrade from absent->present->correct)
            for (let i = 0; i < WORD_LENGTH; i++) {
                const ch = currentGuess[i];
                const newStatus = statuses[i];
                const oldStatus = letterStatus[ch];
                if (newStatus === 'correct') {
                    letterStatus[ch] = 'correct';
                } else if (newStatus === 'present' && oldStatus !== 'correct') {
                    letterStatus[ch] = 'present';
                } else if (newStatus === 'absent' && !oldStatus) {
                    letterStatus[ch] = 'absent';
                }
                // if oldStatus is correct, we never downgrade
            }
            updateKeyboardStatuses();

            // store guess
            guesses.push(currentGuess);

            // check win / loss
            if (currentGuess === secretWord) {
                gameOver = true;
                showMessage('GENIUS! You won! 🎉', false, 'success');
                return;
            }

            // move to next row
            currentRow++;
            currentGuess = "";

            if (currentRow >= MAX_GUESSES) {
                gameOver = true;
                showMessage(`Game over! Word was ${secretWord}`, false, 'error');
            } else {
                // clear message on successful submit
                clearMessage();
            }
        }

        // ---------- HANDLE KEY PRESS (virtual or physical) ----------
        function handleKeyPress(key) {
            if (gameOver) return;

            if (key === 'ENTER') {
                submitGuess();
                return;
            }
            if (key === '⌫' || key === 'BACKSPACE') {
                if (currentGuess.length > 0) {
                    currentGuess = currentGuess.slice(0, -1);
                    updateCurrentRowDisplay();
                }
                return;
            }
            // letter keys
            if (/^[A-Z]$/.test(key)) {
                if (currentGuess.length < WORD_LENGTH) {
                    currentGuess += key;
                    updateCurrentRowDisplay();
                }
            }
        }

        // update only the current row's tiles (before submission)
        function updateCurrentRowDisplay() {
            if (currentRow >= MAX_GUESSES) return;
            const rowTiles = getRowTiles(currentRow);
            for (let i = 0; i < WORD_LENGTH; i++) {
                if (i < currentGuess.length) {
                    rowTiles[i].textContent = currentGuess[i];
                    rowTiles[i].classList.add('filled');
                } else {
                    rowTiles[i].textContent = '';
                    rowTiles[i].classList.remove('filled');
                }
                // remove any status classes (they should only appear after submit)
                rowTiles[i].classList.remove('correct', 'present', 'absent');
            }
        }

        // ---------- MESSAGE HELPERS ----------
        function showMessage(text, isError = false, type = '') {
            messageEl.textContent = text;
            messageEl.className = 'message';
            if (isError) messageEl.classList.add('error');
            if (type === 'success') messageEl.classList.add('success');
            if (type === 'error') messageEl.classList.add('error');
        }

        function clearMessage() {
            messageEl.textContent = '';
            messageEl.className = 'message';
        }

        // ---------- PHYSICAL KEYBOARD LISTENER ----------
        function onPhysicalKey(e) {
            if (gameOver) return;
            const key = e.key.toUpperCase();
            if (key === 'ENTER' || key === 'BACKSPACE' || /^[A-Z]$/.test(key)) {
                e.preventDefault(); // prevent page scroll on space/enter etc.
                handleKeyPress(key);
            }
        }

        // ---------- RESTART ----------
        function restartGame() {
            resetGame();
        }

        // ---------- INITIAL SETUP ----------
        function init() {
            resetGame(); // sets secretWord, renders board, keyboard, resets state
            window.addEventListener('keydown', onPhysicalKey);
            restartBtn.addEventListener('click', restartGame);
        }

        // start the game
        init();

        // Expose for debugging if needed (optional)
        // window.__wordle = { resetGame, handleKeyPress };
    })();
</script>
</body>
</html>
